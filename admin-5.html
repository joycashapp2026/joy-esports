)).changedKeys().size() == 0\n        && request.resource.data.sm.diff(resource.data.get('sm', {})).removedKeys().size() == 0\n        && request.resource.data.pl.size() == resource.data.pl.size() + 1\n        && request.resource.data.pl.size() <= resource.data.slots\n        && getAfter(me()).data.dep == get(me()).data.dep - resource.data.fee);\n    }\n\n    match /txns/{id} {\n      allow read: if isAdmin() || (signedIn() && resource.data.uid == request.auth.uid);\n      allow create: if isAdmin() || (signedIn() && notBanned()\n        && request.resource.data.uid == request.auth.uid\n        && request.resource.data.st == 'p' && request.resource.data.a > 0\n        && (request.resource.data.k in ['dep','tk']\n          || (request.resource.data.k == 'wd'\n              && getAfter(me()).data.win == get(me()).data.win - request.resource.data.a)));\n      allow update, delete: if isAdmin();\n    }\n\n    match /orders/{id} {\n      allow read: if isAdmin() || (signedIn() && resource.data.uid == request.auth.uid);\n      allow create: if isAdmin() || (signedIn() && notBanned()\n        && request.resource.data.uid == request.auth.uid\n        && request.resource.data.st == 'p' && request.resource.data.c > 0\n        && getAfter(me()).data.win == get(me()).data.win - request.resource.data.c);\n      allow update, delete: if isAdmin();\n    }\n\n    match /mail/{id} {\n      allow read: if isAdmin() || (signedIn() && resource.data.uid in [request.auth.uid, 'all']);\n      allow write: if isAdmin();\n    }\n  }\n}\n";

function uw(i){var r=prompt('Warning reason');if(!r)return;var u=usr(i);u.warn++;u.wmsg=r;note(i,'⚠️ Warning: '+r);S();R()}
function ub(i){var u=usr(i);u.ban=u.ban?0:1;note(i,u.ban?'🚫 Your account has been banned.':'✅ Your account has been unbanned.');S();R()}
function uc(i,k){var u=usr(i);if(!u){alert('User ID not found');return}var x=prompt((k=='win'?'Winning':'Deposit')+' coins: + add / - minus');if(!x||isNaN(+x))return;if(k=='win'){u.win+=+x;if(+x>0)u.tw+=+x}else u.dep+=+x;note(i,'Admin adjusted your '+(k=='win'?'winning':'deposit')+' balance by '+x+' coins');S();R()}
function qc(){var u=usr(+g('qi')),x=+g('qa');if(!u||!x){alert('Enter a valid User ID and amount');return}var w=g('qk')=='Winning Coins';if(w){u.win+=x;if(x>0)u.tw+=x}else u.dep+=x;note(u.id,'Admin adjusted your balance by '+x+' coins');S();alert('Done ✅ '+u.n+' · '+(w?'winning':'deposit')+' coins: '+(w?u.win:u.dep));R()}
function upw(i){var u=usr(i);if(!u||!u.em){alert('Email not available');return}if(!confirm('Send password reset email to '+u.em+'?'))return;FB.sendPasswordResetEmail(FB.auth,u.em).then(function(){alert('Reset email sent ✅')}).catch(function(x){alert(x.message)})}
function pw(mi,ui,k){var m=D.matches.filter(function(x){return x.id==mi})[0],p=m.pl.filter(function(x){return x.u==ui})[0],u=usr(ui);if(!u)return;
if(k=='win'){var kl=prompt('Kills ('+p.ig+')',p.k);if(kl===null)return;var c=prompt('Winning coins add (+ / -)');if(!c||isNaN(+c))return;p.k=+kl||0;p.pay+=+c;u.win+=+c;if(+c>0)u.tw+=+c;note(ui,'🏆 '+m.title+': '+(+c>0?'+':'')+c+' winning coins ('+p.k+' kills)')}
else{var d=prompt('Deposit coins add (+ / -)');if(!d||isNaN(+d))return;u.dep+=+d;note(ui,'Admin adjusted your deposit balance by '+d+' coins')}S();R()}
function fm(id){if(!confirm('Mark this match as complete? Results will become visible to users.'))return;D.matches.filter(function(x){return x.id==id})[0].st='done';S();R()}
function addRT(){var d=+g('rd'),r=+g('rr');if(!d||!r){alert('Enter both values');return}D.cfg.rt=RT().concat([{d:d,r:r}]);S();R()}
function delRT(i){var r=RT();r.splice(i,1);D.cfg.rt=r;S();R()}
function um(i){var t=prompt('Message');if(t){note(i,t);S();alert('Sent')}}
function admLogin(){var c=am=='up';return '<div class="ctr" style="margin:30px 0">'+LOGO+'<h1 class="brand big">'+e(D.cfg.app)+'</h1><p class="mu">Admin Panel</p></div><div class="c">'+f('ae','Admin Email','email')+f('ap','Password (min 6)','password')+'<button class="b" onclick="'+(c?'acreate()':'alogin()')+'">'+(c?'Create Admin Account':'Login')+'</button><p class="ctr mu" onclick="am=\''+(c?'in':'up')+'\';R()">'+(c?'Back to login':'First time? Create admin account')+'</p></div>'}
function alogin(){SIGN=1;R();FB.signInWithEmailAndPassword(FB.auth,g('ae'),g('ap')).catch(function(x){SIGN=0;alert('Login failed: '+x.message);R()})}
function acreate(){if(g('ap').length<6){alert('Password min 6 characters');return}SIGN=1;R();FB.createUserWithEmailAndPassword(FB.auth,g('ae'),g('ap')).catch(function(x){SIGN=0;alert('Failed: '+x.message);R()})}
