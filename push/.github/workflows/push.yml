name: Push notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: cd push && npm install --no-audit --no-fund
      - name: Send
        run: node push/send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_PUBLIC: BOK8u3JosGeZwqk5cguM-nNsMA3rpQP_FMhw1YD0Ebh0e3h8qcVNii6FM5TzyA_V0UYCj150vUp8jFnKnvy4InQ
